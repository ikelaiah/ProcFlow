      .flow-edge { stroke: #7c93a5; }
      .wordmark { fill: #e7eef3; }
      .tagline { fill: #8ea3b4; }
    }
  </style>

  <g transform="translate(20 20)">
    <rect class="shell-fill shell-stroke" x="1.5" y="1.5" width="177" height="177" rx="22" stroke-width="3"/>
    <path class="shell-rule" d="M2 38.5h176" fill="none" stroke-width="3"/>

    <circle cx="22" cy="20" r="4" fill="#e4645e"/>
    <circle cx="36" cy="20" r="4" fill="#e8a33d"/>
    <circle cx="50" cy="20" r="4" fill="#54c39b"/>

    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path class="flow-edge" d="M90 59v21M90 104v17M90 121H54v17M90 121h36v17" stroke-width="5"/>
      <path class="flow-edge" d="M54 153v9h72v-9" stroke-width="5" opacity=".55"/>

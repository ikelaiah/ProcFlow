<svg xmlns="http://www.w3.org/2000/svg" width="780" height="220" viewBox="0 0 780 220" role="img" aria-labelledby="title description">
  <title id="title">proc&gt;flow</title>
  <desc id="description">ProcFlow logo with a SQL flowchart inside a terminal window</desc>

  <style>
    .shell-fill { fill: #f5f8fa; }
    .shell-stroke { stroke: #c5d0d8; }
    .shell-rule { stroke: #d9e1e7; }
    .flow-edge { stroke: #6f8798; }
    .wordmark { fill: #14202a; }
    .tagline { fill: #5d7385; }

    @media (prefers-color-scheme: dark) {
      .shell-fill { fill: #18232c; }
      .shell-stroke { stroke: #3a4f5e; }

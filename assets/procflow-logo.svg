    <rect x="77" y="47" width="26" height="20" rx="10" fill="#e8a33d"/>
    <path d="M90 78l13 13-13 13-13-13z" fill="#7ea6e0"/>
    <rect x="39" y="136" width="30" height="20" rx="6" fill="#54c39b"/>

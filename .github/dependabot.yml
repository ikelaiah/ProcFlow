version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # TypeScript majors are not auto-upgradeable. `module: none` is a documented
    # design invariant (docs/ARCHITECTURE.md) and was removed in TypeScript 6/7,
    # so a major bump is an architecture change needing an ADR, not a version
    # bump. See PR #18. Patch and minor updates still arrive normally.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

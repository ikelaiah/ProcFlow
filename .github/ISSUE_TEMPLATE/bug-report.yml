name: Bug report
description: Report a reproducible ProcFlow problem.
title: "Bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Do not include secrets or confidential production data in reproductions.
  - type: input
    id: version
    attributes: {label: ProcFlow version}
    validations: {required: true}
  - type: input
    id: browser
    attributes: {label: Browser and version}
    validations: {required: true}
  - type: textarea
    id: reproduction
    attributes: {label: Steps to reproduce, description: Include a minimal anonymised input where relevant.}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
    validations: {required: true}
  - type: textarea
    id: actual
    attributes: {label: Actual behavior}
    validations: {required: true}
  - type: textarea
    id: logs
    attributes: {label: Console errors or diagnostics}

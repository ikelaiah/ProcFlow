name: Firefox smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install and compile TypeScript
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Locate Firefox
        shell: bash
        run: |
          FIREFOX_PATH="$(command -v firefox || command -v firefox-esr || true)"
          if [ -z "$FIREFOX_PATH" ]; then
            echo "A Firefox browser is required on the runner."
            exit 1
          fi
          echo "FIREFOX_PATH=$FIREFOX_PATH" >> "$GITHUB_ENV"

      - name: Start static test server
        shell: bash
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/procflow-firefox-http.log 2>&1 &
          echo $! > /tmp/procflow-firefox-http.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/tests/firefox-smoke.html > /dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/procflow-firefox-http.log
          exit 1

      - name: Run Firefox compatibility smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/procflow-firefox-smoke.png
          "$FIREFOX_PATH" --headless --no-remote --screenshot /tmp/procflow-firefox-smoke.png \
            http://127.0.0.1:8000/tests/firefox-smoke.html
          test -s /tmp/procflow-firefox-smoke.png

      - name: Stop static test server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/procflow-firefox-http.pid ]; then
            kill "$(cat /tmp/procflow-firefox-http.pid)" 2>/dev/null || true
          fi
